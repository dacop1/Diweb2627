<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mi centro educativo</title>
    <style>

       .centrado {
            text-align: center;
        }
        

         h2 {
            color: orange;
        }
        
    </style>
</head>
<body>
    <h1 style="color: blue"; font-size:32px>IES Los Remedios</h1>

    <h2 style="color: green;">Oferta educativa</h2>
    
    <!-- style="text-align: center;" -->
    <p class="centrado">En nuestro centro impartimos diferentes
       ciclos formativos.</p>

    <h2>Ciclos formativos</h2>

    <ul>
        <li>Desarrollo de Aplicaciones Web</li>
        <li>Administración de Sistemas Informáticos</li>
    </ul>

    <p>Consulta nuestra oferta educativa.</p>

</body>
</html>

<!-- 
1. ¿Qué diferencias encuentras entre las dos soluciones?
 Los estilos en línea se escriben dentro de cada etiqueta, mientras que los estilos internos se agrupan en la etiqueta <style>.

2. ¿Qué sucede si queremos aplicar el mismo estilo a diez páginas?
 Tendríamos que repetir los estilos en cada página, lo que supone más trabajo.

3. ¿Qué modalidad utilizarías en un proyecto real?
 Utilizaría una hoja de estilos externa (CSS) porque es más fácil de mantener y reutilizar. -->
