<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <!-- BEM (Block Element Modifier) es una metodología
      para nombrar clases CSS de forma organizada usando bloques, 
      elementos y modificadores. -->

    <div class="producto">
        <h2 class="producto__titulo">Producto</h2>
        <p class="producto__texto">Descripción del producto</p>
        <button class="producto__boton producto__boton--principal">
            Comprar
        </button>
    </div>

</body>

</html>
